site_name: Veteran Access Bridge
site_description: Governed MCP server for synthetic Veteran healthcare scheduling · GSA SI & MCP hackathon
site_url: https://gsa-mcp-hackathon.github.io/veteran-access-bridge-mcp-server/
repo_url: https://github.com/gsa-mcp-hackathon/veteran-access-bridge-mcp-server
repo_name: gsa-mcp-hackathon/veteran-access-bridge-mcp-server
theme:
  name: material
  variant: classic
  logo: assets/mark.svg
  favicon: assets/mark.svg
  palette:
    primary: custom
    accent: custom
  font: false
  features:
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
nav:
  - Home: index.md
  - Solution & Architecture: solution-architecture.md
  - MCP Implementation: mcp-implementation.md
  - Security & Governance: security-governance.md
  - Evaluation & Results:
      - evaluation/index.md
      - Review the evidence: evaluation/reviewer-index.md
      - Method & Gold Questions: evaluation/method-gold.md
      - Validation & Agent Evidence: evaluation/validation-agent.md
      - Security & Adversarial: evaluation/security-adversarial.md
  - Demonstration: demonstration.md
  - Developer Guide:
      - developer-guide/index.md
      - Getting Started:
          - Prerequisites & Requirements: developer-guide/prerequisites.md
          - VS Code Setup (Recommended): developer-guide/vs-code.md
          - GitHub Codespaces (Optional): developer-guide/codespaces.md
      - Run the MCP Server:
          - Install & Run: developer-guide/local-mcp-server.md
          - Connect to VA Sandbox: developer-guide/vha-sandbox.md
      - Build the Full Avery Experience:
          - Full Setup Overview: developer-guide/connected-product.md
          - 1. Prepare Supabase: developer-guide/supabase.md
          - 2. Configure IBM Cloud: developer-guide/avery-ibm-start.md
          - 3. Set Up Avery in Orchestrate: developer-guide/avery-agent.md
          - 4. Configure LiveKit: developer-guide/livekit.md
          - 5. Configure Deepgram: developer-guide/deepgram.md
          - 6. Connect the Frontend: developer-guide/browser-call.md
          - 7. Run Your First Voice Call: developer-guide/first-voice-call.md
      - Architecture & Decisions:
          - Engineering Decisions: developer-guide/engineering-decisions.md
          - Configuration & Secrets: developer-guide/configuration-and-secrets.md
      - Troubleshooting & Reference:
          - Troubleshooting: developer-guide/troubleshooting.md
          - Clean-room Reproduction: developer-guide/clean-room-reproducibility.md
          - Evaluation:
              - DeepEval: developer-guide/deepeval.md
              - Phoenix: developer-guide/phoenix.md
              - Historical Orchestrate Evaluation: developer-guide/ibm-orchestrate.md
          - Release Checklist: developer-guide/release-checklist.md
extra_css:
  - stylesheets/home.css
  - stylesheets/security-architecture.css
  - stylesheets/homepage.css
extra_javascript:
  - assets/evaluation-report.js
  - assets/header-menu.js
  - assets/security-architecture.js
copyright: 'Veteran Access Bridge · Independent synthetic technical demonstration · Not a VA-operated scheduling service'
