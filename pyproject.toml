[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "veteran-access-bridge"
version = "0.4.1"
description = "Local-first governed scheduling simulation for Veteran Access Bridge"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "fastmcp>=2.14.7,<3",
    "httpx>=0.27,<1",
    "livekit-api>=1,<2",
    "PyJWT[crypto]>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "starlette>=0.40,<2",
    "tzdata>=2025.2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
veteran-access-mcp = "veteran_access_bridge.mcp.app:main"
veteran-access-demo = "veteran_access_bridge.app.asgi:main"
veteran-access-voice-worker = "veteran_access_bridge.voice.livekit_worker:main"

[project.optional-dependencies]
voice = [
    "livekit-agents[deepgram]~=1.8",
]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"veteran_access_bridge.adapters.fixtures" = ["*.json"]
"veteran_access_bridge.mcp.fixtures" = ["*.json"]
"veteran_access_bridge.app.static" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I"]
