# Build the EXISTING Lovable/TanStack Start frontend as a private GHCR image.
# IBM Code Engine can pull this image using its existing ghcr-veteran-access
# registry secret, avoiding source-build IBM Container Registry IAM automation.
name: Publish Avery Call Center image (GHCR)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-avery-callcenter.yml
      - Dockerfile
      - .dockerignore
      - package.json
      - bun.lock
      - vite.config.ts
      - src/**
      - public/**
  workflow_dispatch:
    inputs:
      enable_latency_probe:
        description: Enable diagnostics only for an isolated test image
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-avery-callcenter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish private Node server image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_ENABLE_LATENCY_PROBE=${{ inputs.enable_latency_probe == true && 'true' || 'false' }}
          tags: |
            ghcr.io/${{ github.repository }}:avery-callcenter-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}:avery-callcenter-latest', github.repository) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Veteran Access Bridge synthetic Avery call center frontend
